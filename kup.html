<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
<title>Kup Swieba Client</title>
<style>
/* --- Global --- */
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#f8f9fa;
    color:#212529;
    transition: background 0.3s, color 0.3s;
}
body.dark-theme { background:#121212; color:#e0e0e0; }

/* --- Header --- */
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 40px 10px 20px;
    background:#fff;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:100;
    transition: background 0.3s, border-color 0.3s;
}
body.dark-theme header { background:#1e1e1e; border-color:#333; }
header .logo-container { display:flex; align-items:center; gap:10px; }
header .logo-container img { width:50px; height:50px; }
header .logo-container span { font-size:1.5rem; font-weight:bold; }
#theme-toggle { padding:6px 12px; cursor:pointer; border:1px solid #212529; border-radius:4px; background:#fff; transition:0.3s; }
body.dark-theme #theme-toggle { background:#333; color:#e0e0e0; border-color:#e0e0e0; }

/* --- Nagłówek strony --- */
h1 { text-align:center; font-size:2.2rem; margin:50px 20px; }

/* --- Podsumowanie koszyka --- */
#cartSummary {
    max-width:400px;
    margin:0 auto 40px auto;
    padding:20px;
    border:1px solid #000;
    border-radius:8px;
    background:#fff;
    transition: background 0.3s, border-color 0.3s;
}
body.dark-theme #cartSummary { background:#1e1e1e; border-color:#444; }
#cartSummary ul { list-style:none; padding:0; margin:0; }
#cartSummary li { padding:5px 0; border-bottom:1px solid #ddd; }
body.dark-theme #cartSummary li { border-color:#444; }
#cartSummary p { font-weight:bold; font-size:1.2rem; margin-top:10px; }

/* --- Formularz --- */
form {
    margin:0 auto 50px auto;
    text-align:left;
    background:#fff;
    padding:30px;
    border:1px solid #000;
    border-radius:8px;
    max-width:400px;
    transition: background 0.3s, border-color 0.3s;
}
body.dark-theme form { background:#1e1e1e; border-color:#444; }
form label { display:block; margin-bottom:5px; color:#212529; }
body.dark-theme form label { color:#e0e0e0; }
form input {
    width:100%;
    padding:10px;
    margin-bottom:20px;
    border:1px solid #212529;
    border-radius:5px;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
}
body.dark-theme form input { background:#333; color:#e0e0e0; border-color:#e0e0e0; }
form button {
    width:100%;
    padding:15px;
    background:#007bff;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
    border-radius:5px;
}
form button:hover { background:#0056b3; }

/* --- Footer --- */
footer { margin-top:50px; padding:30px 20px; border-top:1px solid #444; text-align:center; }
body.dark-theme footer { border-color:#666; }
footer a { margin:0 15px; font-size:18px; text-decoration:none; color:#007bff; }
footer a:hover { text-decoration:underline; }

@media(max-width:500px){ form, #cartSummary { width:90%; } }
</style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="images/logo.png" alt="Logo">
        <span>Swieba Client</span>
    </div>
    <button id="theme-toggle">Ciemny motyw</button>
</header>

<h1>Podsumowanie zamówienia</h1>

<div id="cartSummary"></div>

<form id="buyForm">
    <label for="nick">Nick z Minecrafta:</label>
    <input type="text" id="nick" name="nick" required>

    <label for="email">Twój Email:</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">Przejdź do płatności</button>
</form>

<footer>
    <a href="index.html">Strona główna</a>
    <a href="https://discord.gg/RVME9AK57N" target="_blank">Nasz Discord</a>
</footer>

<script>
// --- Motyw ciemny ---
document.getElementById('theme-toggle').addEventListener('click', ()=>{
    document.body.classList.toggle('dark-theme');
});

// --- Pobranie koszyka z index.html ---
let savedCart = JSON.parse(localStorage.getItem('cartData')) || [];
const cartSummary = document.getElementById('cartSummary');

function updateCartSummary(){
    if(savedCart.length === 0){
        cartSummary.innerHTML = "<p>Twój koszyk jest pusty!</p>";
        return;
    }
    let total = 0;
    let html = '<ul>';
    savedCart.forEach(item=>{
        html += `<li>${item.name} x${item.quantity} - ${item.price*item.quantity} zł</li>`;
        total += item.price*item.quantity;
    });
    html += `</ul><p>Łączna kwota: ${total} zł</p>`;
    cartSummary.innerHTML = html;
}
updateCartSummary();

// --- Formularz ---
const form = document.getElementById('buyForm');
form.addEventListener('submit', function(e){
    e.preventDefault();
    const nick = document.getElementById('nick').value.trim();
    const email = document.getElementById('email').value.trim();
    if(!nick || !email){ alert('Wypełnij wszystkie pola!'); return; }

    // Łączna kwota do zapłaty
    let total = savedCart.reduce((sum, item) => sum + item.price*item.quantity, 0);

    const tipplyDescription = `Nick: ${nick}, Email: ${email}, Do zapłaty: ${total} zł`;
    const tipplyLink = `https://tipply.pl/@wvnch4j?desc=${encodeURIComponent(tipplyDescription)}`;
    window.open(tipplyLink, '_blank');
});
</script>

</body>
</html>
